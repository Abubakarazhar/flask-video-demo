services:
  - type: web
    name: factory-safety-monitoring
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 web_interface:app
    envVars:
      - key: OPENAI_API_KEY
        sync: false
    disk:
      name: uploads-disk
      mountPath: /uploads
      sizeGB: 1
